<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="description" content="Invertis Coding Club - Join our coding events and workshops">

    <meta name="keywords" content="Coding Club, Invertis, Programming, B.Tech">

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2721/2721626.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Invertis Coding Club</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="club.html">About</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <h2>Club Registration Form</h2>
    
    <form action="#" method="post">
        <!-- 4.1 Name, Email, Password with label -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="xyz@example.com" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <!-- 4.2 All other inputs -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="9876543210">

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <label>Year:</label>
        <input type="radio" id="y1" name="year" value="1st"> <label for="y1" style="display:inline;">1st Year</label>
        <input type="radio" id="y2" name="year" value="2nd"> <label for="y2" style="display:inline;">2nd Year</label>

        <label>Skills:</label>
        <input type="checkbox" id="html" name="skill" value="HTML"> <label for="html" style="display:inline;">HTML</label>
        <input type="checkbox" id="java" name="skill" value="Java"> <label for="java" style="display:inline;">Java</label>
        <input type="checkbox" id="python" name="skill" value="Python"> <label for="python" style="display:inline;">Python</label>

        <label for="branch">Branch:</label>
        <select id="branch" name="branch">
            <option value="">-- Select Branch --</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
        </select>

        <label for="message">Why do you want to join?</label>
        <textarea id="message" name="message" rows="4" placeholder="Write your message..."></textarea>

        <button type="submit">Register Now</button>
    </form>
</main>

<footer>
    <p>&copy; 2026 Invertis Coding Club</p>
</footer>

</body>
</html>
